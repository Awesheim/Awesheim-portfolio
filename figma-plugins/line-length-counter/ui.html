<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e6e6e6;
    --accent: #18a0fb;
    --code-bg: #f5f5f5;
    --warn: #b25e00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #2c2c2c;
      --fg: #f2f2f2;
      --muted: #a3a3a3;
      --border: #444444;
      --code-bg: #383838;
      --warn: #e0a03c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 11px/1.4 Inter, "Segoe UI", sans-serif;
    color: var(--fg);
    background: var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #empty, #no-text, #error {
    color: var(--muted);
    text-align: center;
    padding: 30px 16px;
  }
  #error { color: #d32f2f; }

  #headline-bar {
    flex-shrink: 0;
    padding: 14px 14px 10px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  #calculating {
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 9px;
    color: var(--muted);
    display: none;
  }
  #headline {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }
  #count {
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
    color: var(--accent);
  }
  #count-label { font-size: 11px; color: var(--muted); }
  #source { font-size: 10px; color: var(--muted); margin-bottom: 6px; }
  #source b { color: var(--fg); font-weight: 600; }
  #line-preview {
    font-family: "SF Mono", Monaco, Consolas, monospace;
    font-size: 10.5px;
    background: var(--code-bg);
    border-radius: 4px;
    padding: 6px 8px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 42px;
    overflow-y: auto;
  }

  #node-list { flex: 1; overflow-y: auto; padding: 10px 14px 14px; }
  .node-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 10px;
  }
  .node-card:last-child { margin-bottom: 0; }
  .node-name {
    font-weight: 600;
    font-size: 11px;
    margin-bottom: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .node-meta {
    color: var(--muted);
    font-size: 9.5px;
    margin-bottom: 6px;
  }
  .node-note {
    color: var(--warn);
    font-size: 9.5px;
    margin-bottom: 6px;
  }
  .line-row {
    display: flex;
    gap: 6px;
    padding: 2px 0;
    border-top: 1px solid var(--border);
    font-size: 10px;
  }
  .line-row:first-of-type { border-top: none; }
  .line-row .idx {
    color: var(--muted);
    flex-shrink: 0;
    width: 16px;
    text-align: right;
  }
  .line-row .text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: "SF Mono", Monaco, Consolas, monospace;
  }
  .line-row .len {
    flex-shrink: 0;
    color: var(--muted);
    min-width: 34px;
    text-align: right;
  }
  .line-row.widest .len { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>

<div id="empty">Select a text layer, or a frame containing one.</div>
<div id="no-text">No text layers found in the selection.</div>
<div id="error"></div>

<div id="result" style="display: none; flex: 1; min-height: 0; display: none; flex-direction: column;">
  <div id="headline-bar">
    <span id="calculating">Calculating&hellip;</span>
    <div id="headline">
      <span id="count">0</span>
      <span id="count-label">characters — widest wrapped line</span>
    </div>
    <div id="source">In <b id="source-name"></b></div>
    <div id="line-preview"></div>
  </div>
  <div id="node-list"></div>
</div>

<script>
var els = {
  empty: document.getElementById('empty'),
  noText: document.getElementById('no-text'),
  error: document.getElementById('error'),
  result: document.getElementById('result'),
  calculating: document.getElementById('calculating'),
  count: document.getElementById('count'),
  sourceName: document.getElementById('source-name'),
  linePreview: document.getElementById('line-preview'),
  nodeList: document.getElementById('node-list')
};

var PANELS = ['empty', 'no-text', 'error', 'result'];

function showOnly(id) {
  PANELS.forEach(function (key) {
    var el = key === 'no-text' ? els.noText : els[key];
    var display = key === 'result' ? 'flex' : 'block';
    el.style.display = (key === id) ? display : 'none';
  });
}

function renderNodeCard(node) {
  var card = document.createElement('div');
  card.className = 'node-card';

  var name = document.createElement('div');
  name.className = 'node-name';
  name.textContent = node.name;
  card.appendChild(name);

  if (node.mixed) {
    var note = document.createElement('div');
    note.className = 'node-note';
    note.textContent = 'Multiple fonts/sizes in this layer — wrap-aware counting needs a single uniform style.';
    card.appendChild(note);
    return card;
  }

  var meta = document.createElement('div');
  meta.className = 'node-meta';
  meta.textContent = node.fontLabel + '  ·  ' + node.widthPx + 'px wide  ·  ' + node.lineCount + (node.lineCount === 1 ? ' line' : ' lines');
  card.appendChild(meta);

  if (!node.wrapEnabled) {
    var wrapNote = document.createElement('div');
    wrapNote.className = 'node-note';
    wrapNote.textContent = 'Auto-width text resizing — this layer never wraps regardless of frame width. Showing raw line breaks.';
    card.appendChild(wrapNote);
  }

  node.lines.forEach(function (line, idx) {
    var row = document.createElement('div');
    row.className = 'line-row' + (node.maxLine && line.length === node.maxLine.length && line.length > 0 ? ' widest' : '');
    var idxSpan = document.createElement('span');
    idxSpan.className = 'idx';
    idxSpan.textContent = (idx + 1) + '.';
    var textSpan = document.createElement('span');
    textSpan.className = 'text';
    textSpan.textContent = line.text || '(empty)';
    var lenSpan = document.createElement('span');
    lenSpan.className = 'len';
    lenSpan.textContent = line.length + ' ch';
    row.appendChild(idxSpan);
    row.appendChild(textSpan);
    row.appendChild(lenSpan);
    card.appendChild(row);
  });

  return card;
}

window.onmessage = function (event) {
  var msg = event.data.pluginMessage;
  if (!msg) return;

  if (msg.type === 'analyzing') {
    els.calculating.style.display = 'block';
    return;
  }
  if (msg.type === 'error') {
    showOnly('error');
    els.error.textContent = msg.message;
    return;
  }
  if (msg.type !== 'result') return;

  els.calculating.style.display = 'none';

  if (msg.state === 'empty') { showOnly('empty'); return; }
  if (msg.state === 'no-text') { showOnly('no-text'); return; }

  showOnly('result');

  if (msg.best) {
    els.count.textContent = msg.best.length;
    els.sourceName.textContent = msg.best.nodeName;
    els.linePreview.textContent = msg.best.line || '(empty line)';
    els.linePreview.style.display = 'block';
  } else {
    els.count.textContent = '—';
    els.sourceName.textContent = 'selection';
    els.linePreview.style.display = 'none';
  }

  els.nodeList.innerHTML = '';
  msg.nodes.forEach(function (node) {
    els.nodeList.appendChild(renderNodeCard(node));
  });
};

showOnly('empty');
</script>
</body>
</html>
