<!-- Provides the native scrollbar range when the fluid scroll is active -->
<div class="scroll-spacer" aria-hidden="true"></div>

<div class="stage">
  <main class="grid" id="grid" aria-label="Selected work">
    <figure>
      <img src="images/work-01.svg" width="900" height="1200" alt="Fjord Series I — screen print with slate circle over layered green ridges">
      <figcaption><span>01</span>Fjord Series — I</figcaption>
    </figure>
    <figure>
      <img src="images/work-02.svg" width="960" height="1200" alt="Solstice poster — ochre sun above a terracotta arch">
      <figcaption><span>02</span>Solstice Poster</figcaption>
    </figure>
    <figure>
      <img src="images/work-03.svg" width="1000" height="1000" alt="Pattern study — alternating solid and outlined circles">
      <figcaption><span>03</span>Pattern Study</figcaption>
    </figure>
    <figure>
      <img src="images/work-04.svg" width="800" height="1200" alt="Arch print — nested plum and cream archways under a small sun">
      <figcaption><span>04</span>Arch — Print</figcaption>
    </figure>
    <figure>
      <img src="images/work-05.svg" width="1200" height="900" alt="Highland silkscreen — overlapping mountain silhouettes and a terracotta sun">
      <figcaption><span>05</span>Highland, Silkscreen</figcaption>
    </figure>
    <figure>
      <img src="images/work-06.svg" width="900" height="1200" alt="Echo cover art — concentric rings in ink, terracotta and slate">
      <figcaption><span>06</span>Echo — Cover Art</figcaption>
    </figure>
    <figure>
      <img src="images/work-07.svg" width="1000" height="1250" alt="Weave identity — horizontal terracotta and ink bars behind an ochre circle">
      <figcaption><span>07</span>Weave Identity</figcaption>
    </figure>
    <figure>
      <img src="images/work-08.svg" width="1200" height="800" alt="Horizon editorial — ochre sun sinking into a slate sea with a wave line">
      <figcaption><span>08</span>Horizon Editorial</figcaption>
    </figure>
    <figure>
      <img src="images/work-09.svg" width="900" height="1200" alt="Signal zine — zigzag ink lines with a terracotta dot">
      <figcaption><span>09</span>Signal Zine</figcaption>
    </figure>
    <figure>
      <img src="images/work-10.svg" width="1000" height="1000" alt="Quadrant logo study — circle divided into four contrasting quarters">
      <figcaption><span>10</span>Quadrant, Logo Study</figcaption>
    </figure>
    <figure>
      <img src="images/work-11.svg" width="900" height="1150" alt="Spine book series — five tilted book spines in the studio palette">
      <figcaption><span>11</span>Spine — Book Series</figcaption>
    </figure>
    <figure>
      <img src="images/work-12.svg" width="1200" height="850" alt="Drift mural — stacked flowing wave lines">
      <figcaption><span>12</span>Drift Mural</figcaption>
    </figure>
